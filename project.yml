name: ClinicalVitalsSync
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ClinicalMapper:
    path: ClinicalMapper
targets:
  ClinicalVitalsSync:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: ClinicalMapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: health.speck.ClinicalVitalsSync
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clinical Sync
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Reads the clinical vitals and lab results your provider sent to Health Records so they can be copied into your Health data.
        NSHealthUpdateUsageDescription: Writes those vitals and lab values into Health as ordinary weight, blood pressure, heart rate and similar samples.
        NSHealthClinicalHealthRecordsShareUsageDescription: Reads your clinical records to find vitals and lab values that Health keeps separate from its main categories.
    entitlements:
      path: App/ClinicalVitalsSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: [health-records]
